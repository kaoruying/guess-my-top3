*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#1b2435;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:650px;margin:auto;padding:16px 14px 70px}.hero{background:#fff;border-radius:18px;padding:20px;margin-bottom:15px}.hero small{font-weight:800;letter-spacing:2px;color:#798298}.hero h1{font-size:26px;margin:9px 0}.hero p{color:#687083;margin:0}.panel{background:#fff;border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 3px 18px #15233b0a}.hidden{display:none!important}h2{font-size:21px;line-height:1.5;margin:8px 0 14px}p{line-height:1.6}.muted{color:#667085}.top{display:flex;justify-content:space-between;align-items:center;background:#283f88;color:white;margin:-18px -18px 18px;border-radius:20px 20px 0 0;padding:15px;font-weight:750;font-size:13px}.track{height:5px;background:#dce4f4;margin:0 -18px 17px}.track span{display:block;height:100%;background:#e7b75a}.stage{font-weight:800;color:#3459aa;margin:12px 0}button{font:inherit;font-weight:750;cursor:pointer;border:0;border-radius:12px;padding:14px;background:#273f89;color:white;min-height:48px}button:disabled{opacity:.35;cursor:default}.primary{width:100%;margin-top:12px}.secondary{background:#e8edfa;color:#2b478b}.choices{display:grid;grid-template-columns:1fr;gap:9px}.choice{display:flex;gap:10px;align-items:center;width:100%;min-width:0;min-height:61px;text-align:left;background:#f7f8fb;color:#202b40;border:2px solid #e5e8ef;padding:10px}.choice.selected{border-color:#446bc6;background:#edf2ff}.letter{flex:none;width:36px;height:39px;display:grid;place-items:center;border-radius:9px;color:#fff;background:#d6ae58;font-size:19px}.choice:nth-child(7n+2) .letter{background:#3d5278}.choice:nth-child(7n+3) .letter{background:#d0786e}.choice:nth-child(7n+4) .letter{background:#7386c9}.choice:nth-child(7n+5) .letter{background:#d0b05e}.choice:nth-child(7n+6) .letter{background:#5c9d88}.choice:nth-child(7n+7) .letter{background:#b67f56}.choiceText{flex:1;min-width:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}.rank{font-size:12px;border-radius:8px;background:#eac56e;color:#312b18;padding:6px;flex:none}.selection{margin:12px 0;background:#f0f3f9;padding:13px;border-radius:11px;line-height:1.7}.row{display:flex;gap:10px}.row button{flex:1;min-width:0}input{font:inherit;font-size:16px;width:100%;padding:14px;border:1px solid #bcc7db;border-radius:11px;margin:7px 0 14px}.tag{display:inline-block;font-size:12px;padding:5px 7px;border-radius:7px;font-weight:750;margin:3px 3px 3px 0;line-height:1.3}.tag.selfA{background:#dbe9ff;color:#1f4f9d}.tag.guessA{background:#fce5bc;color:#855318}.tag.selfB{background:#d8f0e4;color:#196c49}.tag.guessB{background:#f4dff2;color:#82477b}.answer{border:2px solid #e7eaf1;border-radius:13px;padding:10px;margin:9px 0;background:#fff}.answer .line{display:flex;gap:9px;align-items:flex-start}.answer .letter{width:31px;height:34px;font-size:16px}.answer .choiceText{font-size:15px;padding-top:5px}.tags{margin:7px 0 0 39px}.result{background:#eef3fd;padding:14px;border-radius:12px;line-height:1.8;margin:15px 0}.pass{background:#eef2fc;border-radius:16px;padding:20px;text-align:center;margin:18px 0}.pass h2{margin:4px 0}.hint{font-size:13px;color:#667085}.error{color:#b02a48}@media(max-width:390px){.panel{padding:14px}.top{margin:-14px -14px 18px}.track{margin:0 -14px 17px}.choiceText{font-size:14px}.tag{font-size:11px;padding:4px 6px}} 
.compareSection{margin:20px 0 28px}.compareTitle{font-size:17px;margin:0 0 12px;color:#283f88}.compareGrid{display:grid;grid-template-columns:minmax(68px,.8fr) minmax(0,2.3fr) minmax(68px,.8fr);gap:3px;background:#e4e9f2;border:1px solid #e4e9f2;border-radius:13px;overflow:hidden}.compareHead{display:flex;align-items:center;justify-content:center;text-align:center;background:#2c448e;color:white;padding:11px 4px;font-size:12px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}.compareRank{display:flex;align-items:center;justify-content:center;text-align:center;background:white;color:#a2a8b3;font-size:13px;font-weight:750;padding:10px 2px}.compareRank.filled{color:#2c448e;background:#f0f4ff}.compareRank.exact{background:#d9f1e5;color:#146846}.compareRank.partial{background:#fff0d4;color:#966116}.compareOption{background:#fff;display:flex;align-items:center;gap:6px;padding:10px 6px;font-size:13px;line-height:1.4;min-width:0;overflow-wrap:anywhere}.compareLetter{background:#d6ae58;color:white;border-radius:6px;flex:none;display:grid;place-items:center;width:25px;height:27px;font-size:13px;font-weight:800}@media(max-width:370px){.compareGrid{grid-template-columns:minmax(60px,.75fr) minmax(0,2.1fr) minmax(60px,.75fr)}.compareHead{font-size:11px}.compareRank{font-size:12px}.compareOption{font-size:12px;padding:9px 4px}}

body{background:#f5f6fb;color:#172343}main{max-width:560px;padding:10px 12px 50px}.hero{padding:15px 17px;margin-bottom:10px}.hero h1{font-size:23px}.panel{padding:15px;margin:10px 0;border-radius:19px}.top{margin:-15px -15px 0;padding:14px 15px;border-radius:19px 19px 0 0;background:#243e91}.track{margin:0 -15px 14px;height:4px}.stage{margin:8px 0 5px;color:#354d94;font-size:14px}h2{font-size:20px;line-height:1.35;margin:10px 0}.quizInstruction{font-size:12px;margin:4px 0 12px}.choices{gap:7px}.choice{position:relative;overflow:hidden;min-height:48px;padding:8px 10px 8px 17px;border:1px solid #e8eaf2;border-radius:15px;background:linear-gradient(90deg,#fff8ee,#fff);box-shadow:0 1px 3px #1d2c5410}.choice:before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:#edbb54}.choice:nth-child(7n+2){background:linear-gradient(90deg,#fff0f1,#fff)}.choice:nth-child(7n+2):before{background:#e77d87}.choice:nth-child(7n+3){background:linear-gradient(90deg,#eff1ff,#fff)}.choice:nth-child(7n+3):before{background:#7d8ce1}.choice:nth-child(7n+4){background:linear-gradient(90deg,#eaf8f4,#fff)}.choice:nth-child(7n+4):before{background:#65b59b}.choice:nth-child(7n+5){background:linear-gradient(90deg,#f8efff,#fff)}.choice:nth-child(7n+5):before{background:#ba87d8}.choice:nth-child(7n+6){background:linear-gradient(90deg,#eaf3ff,#fff)}.choice:nth-child(7n+6):before{background:#79a9ee}.choice:nth-child(7n+7){background:linear-gradient(90deg,#fff0e7,#fff)}.choice:nth-child(7n+7):before{background:#e6a36d}.choice.selected{border-color:#91b4ed;box-shadow:0 0 0 1px #a5c5f2}.choiceText{font-size:15px;line-height:1.35;font-weight:700}.letter{display:none}.rank{margin-left:auto;display:grid;place-items:center;border-radius:50%;width:29px;height:29px;padding:0;background:#e46e69;color:#fff;font-size:16px}.choice:nth-child(3n+2) .rank{background:#d9a735}.choice:nth-child(3n+3) .rank{background:#7e72ce}.selection{display:none}.quizActions{margin-top:12px}.quizActions button{min-height:45px}.compareSection{margin:17px 0 21px}.compareTitle{text-align:center;color:#273c88;background:#eee6ff;border-radius:30px;padding:7px 12px;font-size:16px;margin:0 auto 10px;width:max-content;max-width:100%}.compareLabels{display:flex;justify-content:space-between;font-size:12px;color:#67718a;font-weight:700;margin:0 8px 5px}.compareList{display:flex;flex-direction:column;gap:3px}.compareLine{display:flex;align-items:center;gap:6px;min-height:36px;border-radius:20px;padding:5px 8px;background:#fff}.compareLine.match{background:#dcecff}.compareNum{flex:0 0 27px;text-align:center;font-size:17px;font-weight:850;color:#263e8c}.compareNum.empty{color:transparent}.compareText{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:700;line-height:1.35}.compareLine:not(.match) .compareText{font-weight:600}.compareSection+.compareSection{border-top:1px solid #e4e8f1;padding-top:18px}.result{background:#edf3ff;padding:10px;border-radius:12px;font-size:13px;margin:12px 0}.revealNote{font-size:12px;margin:8px 0;color:#667085}@media(max-width:390px){.panel{padding:13px}.top{margin:-13px -13px 0}.track{margin:0 -13px 12px}.choice{min-height:45px;padding:7px 9px 7px 15px}.choiceText{font-size:14px}.compareText{font-size:12px}}
.choice .rank{flex:0 0 30px;min-width:30px;min-height:30px;line-height:1;white-space:nowrap;display:flex;align-items:center;justify-content:center}.choice .choiceText{flex:1;min-width:0}</style></head><body><main><header class="hero"><small>BEST 3 CHALLENGE</small><h1>猜猜我的 TOP 3</h1><p>雙人默契挑戰｜一題一題揭曉。</p></header>
<section id="start" class="panel"><h2>雙人默契挑戰</h2><p class="muted">坐在一起，一支手機輪流操作。每題兩人都會選自己的前三名、猜對方的前三名。四組答案都完成才揭曉。</p><label>第一位玩家</label><input id="nameA" maxlength="16" placeholder="例如 Kate" value="Kate"><label>第二位玩家</label><input id="nameB" maxlength="16" placeholder="輸入對方暱稱"><button id="begin" class="primary">開始第一題</button><p id="startError" class="error"></p></section>
<section id="handoff" class="panel hidden"><div class="top"><span>BEST 3 CHALLENGE</span><span id="passCount"></span></div><div class="pass"><p class="muted">請把手機交給</p><h2 id="passName"></h2><p class="muted" id="passDetail"></p></div><button id="ready" class="primary">我是這位玩家，開始作答</button></section>
<section id="quiz" class="panel hidden"><div class="top"><span>BEST 3 CHALLENGE</span><span id="count"></span></div><div class="track"><span id="fill"></span></div><p class="stage" id="stage"></p><h2 id="question"></h2><p class="muted quizInstruction">依喜好順序點選三項；再點一次即可取消。</p><div id="choices" class="choices"></div><div class="selection" id="selection">尚未選擇</div><div class="row quizActions"><button id="undo" class="secondary">重選</button><button id="submit" disabled>確認前三名</button></div></section>
<section id="reveal" class="panel hidden"><div class="top"><span>ANSWERS REVEALED</span><span id="revealCount"></span></div><h2 id="revealQuestion"></h2><p class="revealNote">淺藍色代表雙方都選到相同選項，不論名次。</p><div id="answers"></div><div id="points" class="result"></div><button id="next" class="primary">下一題</button></section>
<section id="end" class="panel hidden"><h2>六題挑戰完成！</h2><div id="totals" class="result"></div><button id="restart" class="primary">重新開始</button></section></main>
<script>
"use strict";
const Q=[["別人稱讚你什麼，會讓你最開心？","你真的很聰明","跟你聊天很舒服","你很有魅力","你真的很貼心","你很有趣","你做事很可靠","有你在真好"],["如果能重新投胎，你最想成為什麼？","超級有錢人","被寵愛的貓","世界級運動員","人氣偶像","自由飛翔的鳥","天才科學家","環遊世界的旅行家"],["給你一億元，你願意接受哪個終身限制？","不能喝冰飲","不能搭飛機","每三個月搬家","不能使用社群媒體","每天晚上10點前睡覺","不能再買新衣服","不能參加節慶活動"],["如果能擁有一種超能力，你最想要哪個？","讀心術","瞬間移動","預知未來","時間暫停","隱形","治癒別人的能力","永遠不會忘記事情"],["哪件小事最容易讓你覺得幸福？","有人記得我的喜好","收到意外的小禮物","被真心稱讚","有人主動邀約","吃到喜歡的美食","獲得獨處時間","有人默默幫我完成事情"],["如果人生可以免費升級一項能力，你最想升級什麼？","過目不忘的記憶力","超強語言能力","完美的歌喉","超高社交能力","超強運動神經","快速學會任何技能","永遠穩定的情緒"]],L="ABCDEFG",KEY="top3-turnbased-v1",el=x=>document.getElementById(x);
let state={names:[],round:0,turn:0,answers:[],totals:[0,0]},picks=[];
function show(id){["start","handoff","quiz","reveal","end"].forEach(x=>el(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0)}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function roundAnswers(){return state.answers[state.round]||[null,null,null,null]}
function person(){return state.turn<2?0:1}
function role(){return state.turn%2===0?"self":"guess"}
function stepName(){let me=state.names[person()],them=state.names[1-person()];return role()==="self"?me+"，請選出你自己的喜好前三名":me+"，你認為 "+them+" 的前三名是什麼？"}
function showPass(){show("handoff");el("passCount").textContent="第 "+(state.round+1)+" / 6 題";el("passName").textContent=state.names[person()];el("passDetail").textContent=state.names[person()]+"，接下來先選自己的前三名，再猜 "+state.names[1-person()]+" 的前三名。請其他人先不要看畫面。"}
function render(){show("quiz");el("count").textContent="QUESTION "+(state.round+1)+" / 6";el("fill").style.width=((state.round+1)/6*100)+"%";el("stage").textContent=stepName();el("question").textContent=Q[state.round][0];el("choices").replaceChildren();Q[state.round].slice(1).forEach((v,i)=>{let b=document.createElement("button");b.className="choice"+(picks.includes(i)?" selected":"");let t=document.createElement("span");t.className="choiceText";t.textContent=v;b.append(t);if(picks.includes(i)){let r=document.createElement("span");r.className="rank";r.textContent=String(picks.indexOf(i)+1);b.append(r)}b.onclick=()=>{if(picks.includes(i))picks=picks.filter(x=>x!==i);else if(picks.length<3)picks.push(i);renderChoices()};el("choices").append(b)});el("selection").textContent=picks.length?picks.map((v,i)=>(i+1)+" "+Q[state.round][v+1]).join(" ／ "):"尚未選擇";el("submit").disabled=picks.length!==3}
function renderChoices(){let bs=el("choices").children;for(let i=0;i<bs.length;i++){let b=bs[i],r=b.querySelector(".rank");b.classList.toggle("selected",picks.includes(i));if(r)r.remove();if(picks.includes(i)){r=document.createElement("span");r.className="rank";r.textContent=String(picks.indexOf(i)+1);b.append(r)}}el("selection").textContent=picks.length?picks.map((v,i)=>(i+1)+" "+Q[state.round][v+1]).join(" ／ "):"尚未選擇";el("submit").disabled=picks.length!==3}
function score(pred,real){let n=0;pred.forEach((v,i)=>{if(real.includes(v))n++;if(real[i]===v)n++});return n}
function reveal(){show("reveal");let a=roundAnswers(),[selfA,guessA,selfB,guessB]=a;el("revealCount").textContent="QUESTION "+(state.round+1)+" / 6";el("revealQuestion").textContent=Q[state.round][0];el("answers").replaceChildren();
function comparison(title,leftName,rightName,leftRanks,rightRanks){let section=document.createElement("section");section.className="compareSection";let h=document.createElement("h3");h.className="compareTitle";h.textContent=title;section.append(h);let labels=document.createElement("div");labels.className="compareLabels";for(let name of [leftName,rightName]){let label=document.createElement("span");label.textContent=name;labels.append(label)}section.append(labels);let list=document.createElement("div");list.className="compareList";Q[state.round].slice(1).forEach((v,i)=>{let li=leftRanks.indexOf(i),ri=rightRanks.indexOf(i);let line=document.createElement("div");line.className="compareLine"+(li>=0&&ri>=0?" match":"");let left=document.createElement("span");left.className="compareNum"+(li<0?" empty":"");left.textContent=li>=0?String(li+1):"·";let text=document.createElement("span");text.className="compareText";text.textContent=v;let right=document.createElement("span");right.className="compareNum"+(ri<0?" empty":"");right.textContent=ri>=0?String(ri+1):"·";line.append(left,text,right);list.append(line)});section.append(list);el("answers").append(section)}

comparison("① "+state.names[1]+" 猜 "+state.names[0],state.names[0]+" 的答案",state.names[1]+" 的猜測",selfA,guessB);
comparison("② "+state.names[0]+" 猜 "+state.names[1],state.names[0]+" 的猜測",state.names[1]+" 的答案",guessA,selfB);
let pA=score(guessA,selfB),pB=score(guessB,selfA);el("points").textContent="本題猜測得分："+state.names[0]+" "+pA+"/6 分｜"+state.names[1]+" "+pB+"/6 分";el("next").textContent=state.round===5?"查看六題總成績":"下一題"}
function finish(){show("end");el("totals").textContent=state.names[0]+"："+state.totals[0]+" / 36 分　｜　"+state.names[1]+"："+state.totals[1]+" / 36 分"}
el("begin").onclick=()=>{let a=el("nameA").value.trim(),b=el("nameB").value.trim();if(!a||!b){el("startError").textContent="請輸入兩位玩家的暱稱";return}state={names:[a,b],round:0,turn:0,answers:[],totals:[0,0]};picks=[];save();showPass()};
el("ready").onclick=()=>{picks=[];render()};
el("undo").onclick=()=>{picks=[];renderChoices()};
el("submit").onclick=()=>{if(picks.length!==3)return;let a=roundAnswers();a[state.turn]=picks.slice();state.answers[state.round]=a;picks=[];state.turn++;save();if(state.turn===4){state.totals[0]+=score(a[1],a[2]);state.totals[1]+=score(a[3],a[0]);save();reveal()}else if(state.turn===2)showPass();else render()};
el("next").onclick=()=>{if(state.round===5){finish();return}state.round++;state.turn=0;picks=[];save();showPass()};
el("restart").onclick=()=>{sessionStorage.removeItem(KEY);state={names:[],round:0,turn:0,answers:[],totals:[0,0]};show("start")};
try{let old=JSON.parse(sessionStorage.getItem(KEY));if(old&&Array.isArray(old.names)&&old.names.length===2&&old.round>=0&&old.round<6){state=old;if(state.turn===4)reveal();else showPass()}else if(old&&old.round===6){state=old;finish()}else show("start")}catch(e){show("start")}
</script></body></html>
