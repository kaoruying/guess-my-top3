<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猜猜我的 TOP 3</title><style>*{box-sizing:border-box}body{margin:0;background:#eff5ff;color:#16284c;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:570px;margin:auto;padding:18px 16px 60px}.hero{background:linear-gradient(120deg,#1b3f9c,#168bc8);border-radius:24px;padding:28px 22px;color:white;margin-bottom:18px}.hero small{color:#ffcb71;letter-spacing:2px;font-weight:800}.hero h1{font-size:34px;margin:12px 0}.panel{background:white;border:1px solid #dbe5f5;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #1b3d8510}h2{margin:0 0 14px;font-size:23px}.muted{color:#60738d;font-size:14px;line-height:1.7}input{width:100%;padding:14px;font-size:16px;border:1px solid #b9cce6;border-radius:12px;margin:7px 0 13px}button{border:0;border-radius:12px;background:#235bbb;color:white;font:700 16px inherit;padding:14px;cursor:pointer}button:disabled{opacity:.4}.secondary{background:#e6efff;color:#244f91}.row{display:flex;gap:10px}.row>*{flex:1}.full{width:100%;margin:8px 0}.hidden{display:none}.option{display:flex;align-items:center;text-align:left;width:100%;gap:12px;background:#f6f9ff;color:#172b52;border:2px solid #dfe8f8;margin:8px 0;padding:12px}.option.active{background:#e7f0ff;border-color:#2462c2}.letter{flex:none;background:#235bbb;color:white;border-radius:8px;padding:8px 11px}.rank{margin-left:auto;background:#ffcb70;color:#52380d;border-radius:8px;padding:4px 8px;font-size:13px}.answer{background:#f1f6ff;padding:12px;border-radius:12px;margin:12px 0;line-height:1.8}.status{background:#fff6e2;padding:12px;border-radius:12px;color:#75530d}.error{color:#b31c3e;white-space:pre-wrap}a{color:#174fba}#results .answer{border-left:4px solid #235bbb}</style></head><body><main><header class="hero"><small>BEST 3 · DUO GAME</small><h1>猜猜我的 TOP 3</h1><div>我猜你，你猜我｜雙手機默契挑戰</div></header><p id="error" class="error"></p><section id="home" class="panel"><h2>開始遊戲</h2><p class="muted">兩個人各自使用手機。先選自己的前三名，再猜對方的前三名，雙方完成後揭曉。</p><label>你的暱稱</label><input id="name" maxlength="16" placeholder="輸入暱稱"><div class="row"><button id="create">建立房間</button><button id="joinShow" class="secondary">加入房間</button></div><div id="joinBox" class="hidden"><label>房間代碼</label><input id="code" placeholder="TOP3-XXXXXX"><button id="join" class="full">確認加入</button></div><p class="muted">需要保持網路連線及網頁開啟；使用 PeerJS 公開訊號服務，連線可能受網路環境影響。</p></section><section id="lobby" class="panel hidden"><h2>等待對方加入</h2><p id="lobbyStatus" class="muted"></p><div class="answer"><strong>房間代碼</strong><h2 id="room"></h2></div><button id="share" class="full">複製邀請文字</button></section><section id="game" class="panel hidden"><p id="stage" class="muted"></p><h2 id="question"></h2><p class="muted">依照排名順序點選三個選項；再次點選可取消。</p><div id="choices"></div><div id="picked" class="answer"></div><button id="next" class="full" disabled>確認並繼續</button></section><section id="wait" class="panel hidden"><h2>已完成，等待對方</h2><p id="waitText" class="muted"></p></section><section id="result" class="panel hidden"><h2>默契挑戰結果</h2><div id="results"></div><button id="restart" class="full">再玩一次</button></section></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const Q=[["別人稱讚你什麼最開心？","你真聰明","你很會聊天","你很受歡迎","你真溫柔","你很開朗","你很有趣","你唱歌很好聽"],["如果能重新投胎，你想成為什麼？","IQ 200 的人","有錢人養的貓","鯨魚","國民偶像","候鳥","總理大臣","天才足球選手"],["給你一億日圓，你願意接受哪個終身限制？","只能喝常溫飲料","不能搭車","每三個月搬家","不能進公園","午夜前必須睡覺","不能穿同色衣服","不能參加季節活動"],["旅行時最想體驗什麼？","泛舟","擠牛奶","採草莓","陶藝","做蕎麥麵","雪山滑雪橇","高空彈跳"],["如果當店長，你想開什麼店？","咖啡廳","雜貨店","麵包店","大眾澡堂","復古家具店","書店","酒吧"],["多出一天假期，你最想做什麼？","睡到自然醒","小旅行","找朋友吃飯","獨自逛街","追劇","按摩","完成待辦事項"],["你最想要哪種超能力？","讀心","瞬間移動","預知未來","時間暫停","隱形","治癒能力","過目不忘"],["最想參加哪種實境節目？","荒島求生","戀愛實境秀","料理競賽","密室逃脫","體能挑戰","明星同居","環遊世界"],["哪件小事最讓你幸福？","有人記得喜好","意外的小禮物","真心稱讚","主動邀約","喜歡的美食","獨處時間","默默被幫忙"],["最想免費升級哪種能力？","記憶力","語言能力","歌喉","社交能力","運動神經","學習速度","情緒穩定"]],$=x=>document.getElementById(x),letters="ABCDEFG";let peer,conn,host=false,me="",other="",room="",phase="self",idx=0,picks=[],mine=[],guess=[],theirMine=null,theirGuess=null,started=false;
function show(id){["home","lobby","game","wait","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function error(s){$("error").textContent=s||""}function send(v){if(conn&&conn.open)conn.send(v)}
function init(id,ready){if(!window.Peer){error("連線元件載入失敗，請重新整理或檢查網路");return}peer=new Peer(id);peer.on("open",ready);peer.on("error",e=>error("連線錯誤："+e.message));peer.on("disconnected",()=>error("訊號服務中斷，請檢查網路"))}
function attach(c){conn=c;c.on("open",()=>{send({type:"hello",name:me});$("lobbyStatus").textContent="連線成功，正在準備遊戲…"});c.on("data",receive);c.on("close",()=>error("對方已斷線，請重新整理後建立新房間"))}
function receive(d){if(d.type==="hello"){other=d.name;if(host){send({type:"start",name:me});start()}}if(d.type==="start"){other=d.name;start()}if(d.type==="self"){theirMine=d.answers;advance()}if(d.type==="guess"){theirGuess=d.answers;advance()}if(d.type==="restart"){reset()}}
function start(){if(started)return;started=true;phase="self";idx=0;picks=[];mine=[];guess=[];theirMine=null;theirGuess=null;render()}
function render(){show("game");$("stage").textContent=(phase==="self"?"選出自己的 TOP 3":"猜猜 "+other+" 的 TOP 3")+"｜第 "+(idx+1)+" / "+Q.length+" 題";$("question").textContent=Q[idx][0];$("choices").replaceChildren();Q[idx].slice(1).forEach((v,i)=>{let b=document.createElement("button");b.className="option"+(picks.includes(i)?" active":"");let a=document.createElement("span");a.className="letter";a.textContent=letters[i];let t=document.createElement("span");t.textContent=v;b.append(a,t);if(picks.includes(i)){let r=document.createElement("span");r.className="rank";r.textContent="第 "+(picks.indexOf(i)+1)+" 名";b.append(r)}b.onclick=()=>{if(picks.includes(i))picks=picks.filter(x=>x!==i);else if(picks.length<3)picks.push(i);render()};$("choices").append(b)});$("picked").textContent=picks.length?"已選排名："+picks.map((p,i)=>(i+1)+". "+letters[p]+" "+Q[idx][p+1]).join("／"):"尚未選擇";$("next").disabled=picks.length!==3}
function advance(){if(phase==="waitSelf"&&theirMine){phase="guess";idx=0;picks=[];render()}else if(phase==="waitGuess"&&theirGuess)finish()}
$("next").onclick=()=>{if(picks.length!==3)return;(phase==="self"?mine:guess).push([...picks]);picks=[];idx++;if(idx<Q.length){render();return}if(phase==="self"){send({type:"self",answers:mine});phase="waitSelf";show("wait");$("waitText").textContent="你的答案已保密儲存，等待 "+other+" 完成。";advance()}else{send({type:"guess",answers:guess});phase="waitGuess";show("wait");$("waitText").textContent="你的猜測已送出，等待 "+other+" 完成。";advance()}};
function score(pred,actual){let n=0;pred.forEach((p,i)=>{if(actual.includes(p))n++;if(actual[i]===p)n++});return n}
function finish(){show("result");let myPoints=guess.reduce((s,g,i)=>s+score(g,theirMine[i]),0),theirPoints=theirGuess.reduce((s,g,i)=>s+score(g,mine[i]),0);$("results").replaceChildren();let summary=document.createElement("div");summary.className="answer";summary.textContent=me+" 猜對 "+myPoints+" / "+(Q.length*6)+" 分；"+other+" 猜對 "+theirPoints+" / "+(Q.length*6)+" 分";$("results").append(summary);Q.forEach((q,i)=>{let d=document.createElement("div");d.className="answer";let h=document.createElement("strong");h.textContent="第 "+(i+1)+" 題："+q[0];d.append(h);[[me,mine[i],theirGuess[i]],[other,theirMine[i],guess[i]]].forEach(([name,real,pred])=>{let p=document.createElement("p");p.textContent=name+" 的答案："+real.map(x=>letters[x]).join(" → ")+"｜對方猜："+pred.map(x=>letters[x]).join(" → ")+"（"+score(pred,real)+" 分）";d.append(p)});$("results").append(d)})}
function reset(){started=false;start()}
$("restart").onclick=()=>{if(!host){error("請由房主按「再玩一次」");return}send({type:"restart"});reset()};
$("joinShow").onclick=()=>$("joinBox").classList.toggle("hidden");
$("create").onclick=()=>{me=$("name").value.trim();if(!me)return error("請先輸入暱稱");error("");host=true;room="TOP3-"+Math.random().toString(36).slice(2,8).toUpperCase();$("room").textContent=room;$("lobbyStatus").textContent="等待另一位玩家加入…";show("lobby");init(room,()=>{});peer.on("connection",c=>{if(conn&&conn.open){c.on("open",()=>c.close());return}attach(c)})};
$("join").onclick=()=>{me=$("name").value.trim();room=$("code").value.trim().toUpperCase();if(!me||!/^TOP3-[A-Z0-9]{6}$/.test(room))return error("請填寫暱稱與完整房間代碼");error("");host=false;$("room").textContent=room;$("lobbyStatus").textContent="正在連線…";show("lobby");init(undefined,()=>attach(peer.connect(room,{reliable:true})))};
$("share").onclick=async()=>{let msg="一起玩「猜猜我的 TOP 3」！\n網址："+location.origin+location.pathname+"?room="+room+"\n房間代碼："+room;try{await navigator.clipboard.writeText(msg);$("share").textContent="已複製邀請文字"}catch(e){prompt("複製邀請文字：",msg)}};
let preset=new URLSearchParams(location.search).get("room");if(preset){$("joinBox").classList.remove("hidden");$("code").value=preset.toUpperCase()}
</script></body></html>
