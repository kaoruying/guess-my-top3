<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猜猜我的 TOP 3</title><style>*{box-sizing:border-box}body{margin:0;background:#eff5ff;color:#16284c;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:570px;margin:auto;padding:18px 16px 60px}.hero{background:linear-gradient(120deg,#1b3f9c,#168bc8);border-radius:24px;padding:28px 22px;color:white;margin-bottom:18px}.hero small{color:#ffcb71;letter-spacing:2px;font-weight:800}.hero h1{font-size:34px;margin:12px 0}.panel{background:white;border:1px solid #dbe5f5;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 25px #1b3d8510}h2{margin:0 0 14px;font-size:23px}.muted{color:#60738d;font-size:14px;line-height:1.7}input{width:100%;padding:14px;font-size:16px;border:1px solid #b9cce6;border-radius:12px;margin:7px 0 13px}button{border:0;border-radius:12px;background:#235bbb;color:white;font:700 16px inherit;padding:14px;cursor:pointer}button:disabled{opacity:.4}.secondary{background:#e6efff;color:#244f91}.row{display:flex;gap:10px}.row>*{flex:1}.full{width:100%;margin:8px 0}.hidden{display:none}.option{display:flex;align-items:center;text-align:left;width:100%;gap:12px;background:#f6f9ff;color:#172b52;border:2px solid #dfe8f8;margin:8px 0;padding:12px}.option.active{background:#e7f0ff;border-color:#2462c2}.letter{flex:none;background:#235bbb;color:white;border-radius:8px;padding:8px 11px}.rank{margin-left:auto;background:#ffcb70;color:#52380d;border-radius:8px;padding:4px 8px;font-size:13px}.answer{background:#f1f6ff;padding:12px;border-radius:12px;margin:12px 0;line-height:1.8}.status{background:#fff6e2;padding:12px;border-radius:12px;color:#75530d}.error{color:#b31c3e;white-space:pre-wrap}a{color:#174fba}#results .answer{border-left:4px solid #235bbb}body{background:#f7f7f8;color:#151515}main{max-width:580px}.hero{background:white;color:#111;border-radius:0;padding:15px 3px;margin-bottom:8px}.hero small{color:#777}.hero h1{font-size:28px}.panel{border:1px solid #ddd;box-shadow:none}.gamebar{background:#283e8c;color:white;margin:-20px -20px 22px;padding:20px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.progress{width:100%;height:5px;background:#5669a4;border-radius:9px}.progress i{display:block;background:#f2bd52;height:100%}.option{width:calc(50% - 8px);display:inline-flex;vertical-align:top;min-height:78px;margin:4px;padding:10px 8px;background:#f2f2f2;border:1px solid #d8d8d8;color:#111;font-size:15px}.option:last-child{width:calc(100% - 8px)}.option.active{background:#e5ecff;border-color:#245fbc}.letter{background:#e8b958;font-size:19px}.option:nth-child(7n+2) .letter{background:#263456}.option:nth-child(7n+3) .letter{background:#d87569}.option:nth-child(7n+4) .letter{background:#6b82d7}.option:nth-child(7n+5) .letter{background:#d9b94e}.option:nth-child(7n+6) .letter{background:#5ca78f}.option:nth-child(7n+7) .letter{background:#d19553}.rank{font-size:11px;white-space:nowrap}.answer{background:#f2f2f2;color:#222}.muted{color:#777}#next{background:#191919}button{font-weight:700}</style></head><body><main><header class="hero"><small>BEST 3 CHALLENGE</small><h1>猜猜我的 TOP 3｜你真的了解我嗎？</h1><div>我猜你，你猜我｜雙手機默契挑戰</div></header><p id="error" class="error"></p><section id="home" class="panel"><h2>開始遊戲</h2><p class="muted">兩人各用一支手機，從 6 道指定題目中隨機抽出 5 題。先選自己的前三名，再猜對方的前三名，最後揭曉默契分數。</p><label>你的暱稱</label><input id="name" maxlength="16" placeholder="輸入暱稱"><div class="row"><button id="create">建立房間</button><button id="joinShow" class="secondary">加入房間</button></div><div id="joinBox" class="hidden"><label>房間代碼</label><input id="code" placeholder="TOP3-XXXXXX"><button id="join" class="full">確認加入</button></div><p class="muted">需要保持網路連線及網頁開啟；使用 Firebase 雲端同步，雙方完成後自動揭曉。</p></section><section id="lobby" class="panel hidden"><h2>等待對方加入</h2><p id="lobbyStatus" class="muted"></p><div class="answer"><strong>房間代碼</strong><h2 id="room"></h2></div><button id="share" class="full">複製邀請文字</button></section><section id="game" class="panel hidden"><div class="gamebar">BEST 3 CHALLENGE <span id="progressLabel"></span><div class="progress"><i id="progressFill"></i></div></div><p id="stage" class="muted"></p><h2 id="question"></h2><p class="muted">依序選出最符合的前三名，點選可取消。</p><div id="choices"></div><div id="picked" class="answer"></div><button id="next" class="full" disabled>確認並繼續</button></section><section id="wait" class="panel hidden"><h2>已完成，等待對方</h2><p id="waitText" class="muted"></p></section><section id="result" class="panel hidden"><h2>默契挑戰結果</h2><div id="results"></div><button id="restart" class="full">再玩一次</button></section></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA8fsJL6vjPyEhPJWXUhBKlY1jVpGVGPt4",authDomain:"guess-my-top3.firebaseapp.com",projectId:"guess-my-top3",storageBucket:"guess-my-top3.firebasestorage.app",messagingSenderId:"975236618240",appId:"1:975236618240:web:6d1a9467e715ca7b1d20e5",measurementId:"G-S8T2QCNSW8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const Q=[["別人稱讚你什麼，會讓你最開心？","你真的很聰明","跟你聊天很舒服","你很有魅力","你真的很貼心","你很有趣","你做事很可靠","有你在真好"],["如果能重新投胎，你最想成為什麼？","超級有錢人","被寵愛的貓","世界級運動員","人氣偶像","自由飛翔的鳥","天才科學家","環遊世界的旅行家"],["給你一億元，你願意接受哪個終身限制？","不能喝冰飲","不能搭飛機","每三個月搬家","不能使用社群媒體","每天晚上10點前睡覺","不能再買新衣服","不能參加節慶活動"],["一起出國旅行，你最想體驗什麼？","高空彈跳","入住頂級飯店","體驗當地料理","參加大型音樂祭","到無人島探險","看極光","完全不排行程隨興走"],["如果可以開一家店，你想開什麼？","咖啡廳","麵包店","花店","書店","居酒屋","選物店","寵物咖啡廳"],["如果突然多出一整天假期，你最想做什麼？","睡到自然醒","安排一日小旅行","找朋友吃飯","一個人逛街","追劇打電動","去按摩放鬆","把待辦事項做完"],["如果能擁有一種超能力，你最想要哪個？","讀心術","瞬間移動","預知未來","時間暫停","隱形","治癒別人的能力","永遠不會忘記事情"],["最想參加哪種實境節目？","荒島求生","戀愛實境秀","料理競賽","密室逃脫","體能挑戰","明星同居","環遊世界"],["哪件小事最容易讓你覺得幸福？","有人記得我的喜好","收到意外的小禮物","被真心稱讚","有人主動邀約","吃到喜歡的美食","獲得獨處時間","有人默默幫我完成事情"],["如果人生可以免費升級一項能力，你最想升級什麼？","過目不忘的記憶力","超強語言能力","完美的歌喉","超高社交能力","超強運動神經","快速學會任何技能","永遠穩定的情緒"]],$=x=>document.getElementById(x),letters="ABCDEFG";
let me="",room="",host=false,uid="",roomRef=null,unsubscribe=null,roomData=null,phase="self",idx=0,picks=[],mine=[],guess=[],round=1,finished=false,busy=false;
function show(id){["home","lobby","game","wait","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function error(s){$("error").textContent=s||""}
function friendly(e){let c=e?.code||"";if(c.includes("permission-denied"))return "Firestore 權限不足：請確認資料庫規則已發布。";if(c.includes("auth/operation-not-allowed"))return "尚未開啟 Firebase 匿名登入。";if(c.includes("unavailable"))return "暫時無法連接 Firebase，請檢查網路。";return (e?.message||String(e))}
async function login(){if(auth.currentUser)return auth.currentUser;let r=await signInAnonymously(auth);return r.user}
function watch(){if(unsubscribe)unsubscribe();unsubscribe=onSnapshot(roomRef,s=>{if(!s.exists()){error("房間不存在");return}roomData=s.data();round=roomData.round||1;const other=host?roomData.guestName:roomData.hostName;if(!other){show("lobby");$("lobbyStatus").textContent=host?"房間已就緒，可以邀請另一位玩家加入。":"等待房主…";return}
if(!roomData.hostSelf||!roomData.guestSelf){if(phase==="waitSelf"){show("wait");$("waitText").textContent="已完成自己的 TOP 3，等待 "+other+" 作答。"}else if(phase==="self")render();return}
if(phase==="waitSelf"){phase="guess";idx=0;picks=[];render()}
if(roomData.hostGuess&&roomData.guestGuess){if(!finished){finished=true;finish()}return}
if(phase==="waitGuess"){show("wait");$("waitText").textContent="已送出猜測，等待 "+other+" 完成。"}},e=>error(friendly(e)))}
function questionAt(i){return Q[(roomData?.questions||[0,1,2,3,4])[i]]}function render(){show("game");$("progressLabel").textContent="QUESTION "+(idx+1)+" / 5";$("progressFill").style.width=((idx+1)*20)+"%";let other=host?roomData?.guestName:roomData?.hostName;$("stage").textContent=(phase==="self"?"選出自己的 TOP 3":"猜猜 "+other+" 的 TOP 3")+"｜第 "+(idx+1)+" / "+5+" 題";$("question").textContent=questionAt(idx)[0];$("choices").replaceChildren();questionAt(idx).slice(1).forEach((v,i)=>{let b=document.createElement("button");b.className="option"+(picks.includes(i)?" active":"");let a=document.createElement("span");a.className="letter";a.textContent=letters[i];let t=document.createElement("span");t.textContent=v;b.append(a,t);if(picks.includes(i)){let r=document.createElement("span");r.className="rank";r.textContent="第 "+(picks.indexOf(i)+1)+" 名";b.append(r)}b.onclick=()=>{if(picks.includes(i))picks=picks.filter(x=>x!==i);else if(picks.length<3)picks.push(i);render()};$("choices").append(b)});$("picked").textContent=picks.length?"已選排名："+picks.map((p,i)=>(i+1)+". "+letters[p]+" "+questionAt(idx)[p+1]).join("／"):"尚未選擇";$("next").disabled=picks.length!==3}
$("next").onclick=async()=>{if(picks.length!==3||busy)return;const stage=phase;(stage==="self"?mine:guess).push([...picks]);picks=[];idx++;if(idx<5){render();return}busy=true;try{if(stage==="self"){phase="waitSelf";await updateDoc(roomRef,{[host?"hostSelf":"guestSelf"]:mine.map(a=>({rank:a}))});show("wait");$("waitText").textContent="答案已儲存，等待對方完成。"}else{phase="waitGuess";await updateDoc(roomRef,{[host?"hostGuess":"guestGuess"]:guess.map(a=>({rank:a}))});show("wait");$("waitText").textContent="猜測已送出，等待對方完成。"}}catch(e){error(friendly(e));phase=stage;idx=5-1;picks=(stage==="self"?mine:guess).pop();render()}finally{busy=false}};
function score(pred,actual){pred=pred.rank||pred;actual=actual.rank||actual;let n=0;pred.forEach((p,i)=>{if(actual.includes(p))n++;if(actual[i]===p)n++});return n}
function finish(){show("result");const d=roomData,other=host?d.guestName:d.hostName,myGuess=host?d.hostGuess:d.guestGuess,theirMine=host?d.guestSelf:d.hostSelf,theirGuess=host?d.guestGuess:d.hostGuess,myReal=host?d.hostSelf:d.guestSelf;let myPoints=myGuess.reduce((s,g,i)=>s+score(g,theirMine[i]),0),theirPoints=theirGuess.reduce((s,g,i)=>s+score(g,myReal[i]),0);$("results").replaceChildren();let summary=document.createElement("div");summary.className="answer";summary.textContent=me+" 猜對 "+myPoints+" / "+(5*6)+" 分；"+other+" 猜對 "+theirPoints+" / "+(5*6)+" 分";$("results").append(summary);(d.questions||[0,1,2,3,4]).map(i=>Q[i]).forEach((q,i)=>{let div=document.createElement("div");div.className="answer";let h=document.createElement("strong");h.textContent="第 "+(i+1)+" 題："+q[0];div.append(h);[[me,myReal[i],theirGuess[i]],[other,theirMine[i],myGuess[i]]].forEach(([name,real,pred])=>{let p=document.createElement("p");p.textContent=name+" 的答案："+(real.rank||real).map(x=>letters[x]).join(" → ")+"｜對方猜："+(pred.rank||pred).map(x=>letters[x]).join(" → ")+"（"+score(pred,real)+" 分）";div.append(p)});$("results").append(div)})}
$("joinShow").onclick=()=>$("joinBox").classList.toggle("hidden");
$("create").onclick=async()=>{me=$("name").value.trim();if(!me)return error("請先輸入暱稱");error("");$("create").disabled=true;try{uid=(await login()).uid;host=true;room="TOP3-"+Math.random().toString(36).slice(2,8).toUpperCase();roomRef=doc(db,"rooms",room);await setDoc(roomRef,{hostUid:uid,hostName:me,guestUid:null,guestName:null,hostSelf:null,guestSelf:null,hostGuess:null,guestGuess:null,round:1,questions:[0,1,2,6,8,9].sort(()=>Math.random()-.5).slice(0,5),createdAt:serverTimestamp()});$("room").textContent=room;$("share").disabled=false;show("lobby");watch()}catch(e){error(friendly(e));show("home")}finally{$("create").disabled=false}};
$("join").onclick=async()=>{me=$("name").value.trim();room=$("code").value.trim().toUpperCase();if(!me||!/^TOP3-[A-Z0-9]{6}$/.test(room))return error("請填寫暱稱與完整房間代碼");error("");$("join").disabled=true;try{uid=(await login()).uid;roomRef=doc(db,"rooms",room);let snap=await getDoc(roomRef);if(!snap.exists())throw Error("找不到房間，請向房主確認代碼");let d=snap.data();if(d.guestUid&&d.guestUid!==uid)throw Error("房間已有兩位玩家，請房主建立新房間");if(d.hostUid===uid)throw Error("不能用同一個帳號加入自己的房間");host=false;await updateDoc(roomRef,{guestUid:uid,guestName:me});$("room").textContent=room;show("lobby");watch()}catch(e){error(friendly(e));show("home")}finally{$("join").disabled=false}};
$("share").onclick=async()=>{let msg="一起玩「猜猜我的 TOP 3」！\n網址："+location.origin+location.pathname+"?room="+room+"\n房間代碼："+room;try{await navigator.clipboard.writeText(msg);$("share").textContent="已複製邀請文字"}catch(e){prompt("複製邀請文字：",msg)}};
$("restart").onclick=async()=>{if(!host)return error("請由房主按「再玩一次」");try{await updateDoc(roomRef,{hostSelf:null,guestSelf:null,hostGuess:null,guestGuess:null,round:round+1,questions:[0,1,2,6,8,9].sort(()=>Math.random()-.5).slice(0,5)});finished=false;phase="self";idx=0;picks=[];mine=[];guess=[];render()}catch(e){error(friendly(e))}};
let preset=new URLSearchParams(location.search).get("room");if(preset){$("joinBox").classList.remove("hidden");$("code").value=preset.toUpperCase()}
</script></body></html>
