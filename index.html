ro small{color:#777}.hero h1{font-size:28px}.panel{border:1px solid #ddd;box-shadow:none}.gamebar{background:#283e8c;color:white;margin:-20px -20px 22px;padding:20px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.progress{width:100%;height:5px;background:#5669a4;border-radius:9px}.progress i{display:block;background:#f2bd52;height:100%}.option{width:calc(50% - 8px);display:inline-flex;vertical-align:top;min-height:78px;margin:4px;padding:10px 8px;background:#f2f2f2;border:1px solid #d8d8d8;color:#111;font-size:15px}.option:last-child{width:calc(100% - 8px)}.option.active{background:#e5ecff;border-color:#245fbc}.letter{background:#e8b958;font-size:19px}.option:nth-child(7n+2) .letter{background:#263456}.option:nth-child(7n+3) .letter{background:#d87569}.option:nth-child(7n+4) .letter{background:#6b82d7}.option:nth-child(7n+5) .letter{background:#d9b94e}.option:nth-child(7n+6) .letter{background:#5ca78f}.option:nth-child(7n+7) .letter{background:#d19553}.rank{font-size:11px;white-space:nowrap}.answer{background:#f2f2f2;color:#222}.muted{color:#777}#next{background:#191919}button{font-weight:700}.option{min-width:0;gap:8px;align-items:center}.option>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere;word-break:normal;line-height:1.45;text-align:left}.option .letter,.option .rank{flex-shrink:0}.option .rank{padding:5px 6px}@media(max-width:540px){.option{width:calc(100% - 8px);min-height:64px;padding:10px 12px}.option:last-child{width:calc(100% - 8px)}.hero h1{font-size:24px}.panel{padding:16px}.gamebar{margin:-16px -16px 20px}} input:focus{scroll-margin-bottom:180px}html{scroll-padding-bottom:180px}@media(max-width:540px){main{padding-bottom:220px}#home{scroll-margin-bottom:180px}input{font-size:16px}}</style></head><body><main><header class="hero"><small>BEST 3 CHALLENGE</small><h1>猜猜我的 TOP 3｜你真的了解我嗎？</h1><div>我猜你，你猜我｜雙手機默契挑戰</div></header><p id="error" class="error"></p><p id="bootStatus" class="muted" style="margin:4px 12px">正在連接遊戲服務…</p><section id="home" class="panel"><h2>開始遊戲</h2><p class="muted">兩人各用一支手機，六題依序挑戰，每題先選自己的 TOP 3，再互猜對方的 TOP 3；雙方猜完立即揭曉該題結果。</p><label>你的暱稱</label><input id="name" maxlength="16" placeholder="輸入暱稱" enterkeyhint="done" autocomplete="nickname"><div class="row"><button id="create">建立房間</button><button id="joinShow" class="secondary">加入房間</button></div><div id="joinBox" class="hidden"><label>房間代碼</label><input id="code" placeholder="TOP3-XXXXXX" enterkeyhint="done" autocapitalize="characters" autocomplete="off"><button id="join" class="full">確認加入</button></div><p class="muted">需要保持網路連線及網頁開啟；使用 Firebase 雲端同步，雙方完成後自動揭曉。</p></section><section id="lobby" class="panel hidden"><h2>等待對方加入</h2><p id="lobbyStatus" class="muted"></p><div class="answer"><strong>房間代碼</strong><h2 id="room"></h2></div><button id="share" class="full">複製邀請文字</button></section><section id="game" class="panel hidden"><div class="gamebar">BEST 3 CHALLENGE <span id="progressLabel"></span><div class="progress"><i id="progressFill"></i></div></div><p id="stage" class="muted"></p><h2 id="question"></h2><p class="muted">依序選出最符合的前三名，點選可取消。</p><div id="choices"></div><div id="picked" class="answer"></div><button id="next" class="full" disabled>確認並繼續</button></section><section id="wait" class="panel hidden"><h2>等待對方完成</h2><p id="waitText" class="muted"></p></section><section id="result" class="panel hidden"><h2>默契挑戰結果</h2><div id="results"></div><button id="restart" class="full">繼續下一題</button></section></main><script>window.addEventListener("error",e=>{let x=document.getElementById("bootStatus");if(x)x.textContent="遊戲程式載入失敗，請重新整理或改用 Safari 開啟："+(e.message||"網路連線問題")});window.addEventListener("unhandledrejection",e=>{let x=document.getElementById("error");if(x)x.textContent="連線錯誤："+(e.reason?.message||String(e.reason))});setTimeout(()=>{if(!window.__top3Ready){let x=document.getElementById("bootStatus");if(x)x.textContent="遊戲程式未成功載入，請使用 Safari 開啟並重新整理。"}},8000);</script><script type="module">

document.addEventListener("focusin",e=>{if(e.target.matches("input"))setTimeout(()=>e.target.scrollIntoView({block:"center",behavior:"smooth"}),300)});document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input")){e.preventDefault();e.target.blur();if(e.target.id==="name"&&!document.getElementById("joinBox").classList.contains("hidden"))document.getElementById("code").focus()}});const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);window.__top3Ready=true;document.getElementById("bootStatus").textContent="遊戲服務已載入，可以建立房間。";

const ORDER=[0,1,2,6,8,9],TOTAL=ORDER.length;
let me="",room="",host=false,uid="",roomRef=null,unsubscribe=null,roomData=null,busy=false,lastRound=0,picks=[],viewKey="",seenRound=0;
function show(id){["home","lobby","game","wait","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function error(s){$("error").textContent=s||""}
function friendly(e){let c=e?.code||"";if(c.includes("permission-denied"))return "Firestore 權限不足，請檢查資料庫規則。";if(c.includes("auth/operation-not-allowed"))return "尚未開啟 Firebase 匿名登入。";return e?.message||String(e)}
async function login(){if(auth.currentUser)return auth.currentUser;return await Promise.race([signInAnonymously(auth).then(r=>r.user),new Promise((_,reject)=>setTimeout(()=>reject(Error("匿名登入逾時。請確認 Firebase Authentication 已啟用匿名登入，並使用 Safari 開啟網站。")),12000))])}
const myField=()=>host?"host":"guest",otherField=()=>host?"guest":"host";
function qIndex(){return roomData?.questions?.[roomData?.step||0]??ORDER[roomData?.step||0]}
function q(){return Q[qIndex()]}
function rankOf(v){return v?.rank||[]}
function score(p,a){p=rankOf(p);a=rankOf(a);let n=0;p.forEach((x,i)=>{if(a.includes(x))n++;if(a[i]===x)n++});return n}
function applyState(force=false){
 if(!roomData)return;
 let d=roomData,step=d.step||0,other=d[otherField()+"Name"];
 if(!other){show("lobby");$("lobbyStatus").textContent="房間已就緒，等待另一位玩家加入。";return}
 if(step>=TOTAL){viewKey="final";finalResult();return}
 let mine=d[myField()+"Self"],theirs=d[otherField()+"Self"],myGuess=d[myField()+"Guess"],theirGuess=d[otherField()+"Guess"];
 let mode=!mine?"self":!myGuess?"guess":!theirs||!theirGuess?"waitGuess":"reveal";
 let key=step+":"+mode;
 if(force||key!==viewKey){
   viewKey=key;picks=[];
   if(mode==="self"||mode==="guess")render(mode);
   else if(mode==="reveal")reveal();
   else{show("wait");$("waitText").textContent="已送出自己的答案與猜測，等待 "+other+" 完成。"}
 }else if(mode==="reveal"&&$("result").classList.contains("hidden"))reveal();
}
function watch(){
 if(unsubscribe)unsubscribe();
 unsubscribe=onSnapshot(roomRef,s=>{
   if(!s.exists()){error("房間不存在");return}
   roomData=s.data();applyState();
 },e=>error(friendly(e)));
}
function render(mode){show("game");let step=roomData.step||0;$("progressLabel").textContent="QUESTION "+(step+1)+" / "+TOTAL;$("progressFill").style.width=((step+1)/TOTAL*100)+"%";$("stage").textContent=(mode==="self"?"第一步｜選出自己的 TOP 3":"第二步｜猜猜 "+roomData[otherField()+"Name"]+" 的 TOP 3")+"｜第 "+(step+1)+" 題";$("question").textContent=q()[0];$("choices").replaceChildren();q().slice(1).forEach((v,i)=>{let b=document.createElement("button");b.className="option"+(picks.includes(i)?" active":"");let a=document.createElement("span");a.className="letter";a.textContent=letters[i];let t=document.createElement("span");t.textContent=v;b.append(a,t);if(picks.includes(i)){let r=document.createElement("span");r.className="rank";r.textContent="第 "+(picks.indexOf(i)+1)+" 名";b.append(r)}b.onclick=()=>{if(picks.includes(i))picks=picks.filter(x=>x!==i);else if(picks.length<3)picks.push(i);render(mode)};$("choices").append(b)});$("picked").textContent=picks.length?"已選排名："+picks.map((p,i)=>(i+1)+". "+letters[p]+" "+q()[p+1]).join("／"):"尚未選擇";$("next").disabled=picks.length!==3||busy;$("next").textContent=mode==="self"?"確認我的 TOP 3":"送出對對方的猜測"}
$("next").onclick=async()=>{
 if(picks.length!==3||busy)return;
 let mode=roomData[myField()+"Self"]?"guess":"self";
 let rank=[...picks];
 busy=true;$("next").disabled=true;error("");
 try{
   await updateDoc(roomRef,{[myField()+(mode==="self"?"Self":"Guess")]:{rank}});

};
function reveal(){show("result");let d=roomData,step=d.step||0,other=d[otherField()+"Name"],myReal=d[myField()+"Self"],otherReal=d[otherField()+"Self"],myGuess=d[myField()+"Guess"],otherGuess=d[otherField()+"Guess"],mine=score(myGuess,otherReal),theirs=score(otherGuess,myReal);
$("results").replaceChildren();let h=document.createElement("h3");h.textContent="第 "+(step+1)+" / "+TOTAL+" 題｜"+q()[0];$("results").append(h);

[[me,myReal,otherGuess,other],[other,otherReal,myGuess,me]].forEach(([name,real,pred,who])=>{let d=document.createElement("div");d.className="answer";let title=document.createElement("strong");title.textContent=name+" 的答案 vs "+who+" 的猜測";d.append(title);let p=document.createElement("p");p.textContent=rankOf(real).map((x,i)=>(i+1)+". "+letters[x]+" "+q()[x+1]).join("／");d.append(p);let t=document.createElement("p");t.textContent="猜測："+rankOf(pred).map((x,i)=>(i+1)+". "+letters[x]+" "+q()[x+1]).join("／")+"（"+score(pred,real)+" / 6 分）";d.append(t);$("results").append(d)});

function finalResult(){show("result");$("results").replaceChildren();let d=roomData,other=d[otherField()+"Name"],a=d.scores?.[myField()]||0,b=d.scores?.[otherField()]||0;let h=document.createElement("h2");h.textContent="六題默契挑戰完成！";let p=document.createElement("div");p.className="answer";p.textContent=me+" 猜對 "+a+" / 36 分；"+other+" 猜對 "+b+" / 36 分";$("results").append(h,p);$("restart").textContent="再玩一次";$("restart").disabled=!host}
$("restart").onclick=async()=>{if(busy)return;let d=roomData,step=d.step||0;if(!host){$("restart").disabled=true;return}busy=true;try{if(step>=TOTAL){await updateDoc(roomRef,{step:0,hostSelf:null,guestSelf:null,hostGuess:null,guestGuess:null,scores:{host:0,guest:0},questions:ORDER.slice()})}else{let a=score(d.hostGuess,d.guestSelf),b=score(d.guestGuess,d.hostSelf);await updateDoc(roomRef,{step:step+1,hostSelf:null,guestSelf:null,hostGuess:null,guestGuess:null,scores:{host:(d.scores?.host||0)+a,guest:(d.scores?.guest||0)+b}})}}catch(e){error(friendly(e))}finally{busy=false}};
$("joinShow").onclick=()=>$("joinBox").classList.toggle("hidden");
$("create").onclick=async()=>{me=$("name").value.trim();if(!me)return error("請先輸入暱稱");error("");$("create").disabled=true;$("bootStatus").textContent="正在建立房間，請稍候…";try{uid=(await login()).uid;host=true;room="TOP3-"+Math.random().toString(36).slice(2,8).toUpperCase();roomRef=doc(db,"rooms",room);await setDoc(roomRef,{hostUid:uid,hostName:me,guestUid:null,guestName:null,hostSelf:null,guestSelf:null,hostGuess:null,guestGuess:null,step:0,scores:{host:0,guest:0},questions:ORDER.slice(),createdAt:serverTimestamp()});$("room").textContent=room;show("lobby");watch()}catch(e){error(friendly(e));show("home")}finally{$("create").disabled=false;$("bootStatus").textContent="遊戲服務已載入。"}};
$("join").onclick=async()=>{me=$("name").value.trim();room=$("code").value.trim().toUpperCase();if(!me||!/^TOP3-[A-Z0-9]{6}$/.test(room))return error("請填寫暱稱與完整房間代碼");error("");$("join").disabled=true;try{uid=(await login()).uid;roomRef=doc(db,"rooms",room);let snap=await getDoc(roomRef);if(!snap.exists())throw Error("找不到房間");let d=snap.data();if(d.guestUid&&d.guestUid!==uid)throw Error("房間已有兩位玩家");if(d.hostUid===uid)throw Error("不能加入自己的房間");host=false;await updateDoc(roomRef,{guestUid:uid,guestName:me});$("room").textContent=room;show("lobby");watch()}catch(e){error(friendly(e));show("home")}finally{$("join").disabled=false}};
