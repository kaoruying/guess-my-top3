atus.textContent="這個分頁找不到遊戲紀錄。請回到原本玩遊戲的 Chrome 分頁，直接在該分頁的網址列輸入這個恢復頁網址，不要另開新分頁。"}else{status.textContent="找到 "+state.names.join("、")+" 的遊戲資料。以下同時列出實際選擇與彼此猜測，不包含分數。";let lines=["猜猜我的 TOP 3｜六題完整答案紀錄"];state.answers.forEach((a,i)=>{if(!a||a.length<4)return;const groups=[[state.names[0]+" 自己選的前三名",a[0]],[state.names[1]+" 猜 "+state.names[0]+" 的前三名",a[3]],[state.names[1]+" 自己選的前三名",a[2]],[state.names[0]+" 猜 "+state.names[1]+" 的前三名",a[1]]];let section=document.createElement("section"),h=document.createElement("h2");h.textContent="第 "+(i+1)+" 題｜"+Q[i][0];section.append(h);lines.push("","第 "+(i+1)+" 題｜"+Q[i][0]);groups.forEach(([name,arr])=>{let div=document.createElement("div");div.className="group";let title=document.createElement("div");title.className="name";title.textContent=name;div.append(title);lines.push(name);if(Array.isArray(arr))arr.forEach((v,j)=>{let row=document.createElement("div");row.className="item";let num=document.createElement("span");num.className="num r"+(j+1);num.textContent=j+1;row.append(num,document.createTextNode(Q[i][v+1]||"未知選項"));div.append(row);lines.push((j+1)+". "+(Q[i][v+1]||"未知選項"))});section.append(div)});root.append(section)});btn.hidden=false;btn.onclick=()=>{let blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="TOP3_完整答案_含彼此猜測.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}}</script></body></html>
